name: CI

on:
  push:
  pull_request:

jobs:
  baseline:
    # 主流水线 + 回归测试，覆盖两个 Python 版本
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run main pipeline
        run: python credit_scoring.py
      - name: Run regression tests
        run: python -m pytest tests/ -v

  experiments:
    # 三项后续改进实验（依赖 baseline 通过后再跑，避免重复等待）
    runs-on: ubuntu-latest
    needs: baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Experiment 1 - tree models comparison
        run: python experiments/tree_models.py
      - name: Experiment 2 - reject inference simulation
        run: python experiments/reject_inference.py
      - name: Experiment 3 - class imbalance comparison
        run: python experiments/imbalance.py
